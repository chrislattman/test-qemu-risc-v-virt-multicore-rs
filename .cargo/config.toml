[build]
# RV64IMAC with the soft-float lp64 ABI: the compiler never uses FP registers (there are none),
# so trap_entry only saves integer registers
target = "riscv64imac-unknown-none-elf"

[target.riscv64imac-unknown-none-elf]
# Cargo appends core0's ELF path to the runner. qemu.sh builds core1 too, then starts QEMU with both.
# In another shell: telnet localhost 5678
# Quit qemu: (qemu) quit
# Quit telnet: Ctrl + ] -> telnet> quit
runner = ["./qemu.sh"]

[alias]
qemu = ["run", "--release"]

# Debug build; halts and waits for GDB on localhost:1234
# In another shell:
#   gdb-multiarch -q ./target/riscv64imac-unknown-none-elf/debug/core0
#   (gdb) add-symbol-file ./target/riscv64imac-unknown-none-elf/debug/core1
#   (gdb) target remote localhost:1234
#   (gdb) break core1::main_app
#   (gdb) continue
# In another shell: telnet localhost 5678
qemu-debug = ["run", "--config", "target.riscv64imac-unknown-none-elf.runner=['./qemu.sh','--gdb']"]
